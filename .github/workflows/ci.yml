name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Seatbelt (sandbox-exec) and APFS clones only exist on macOS; macos-14 runners are Apple Silicon.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The voice and RouteLLM extras are not needed by the test suite (models are faked, imports are lazy).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m spacy download zh_core_web_sm

      - name: Test
        env:
          ROUTELLM_ENABLED: "false"
          WEB_ENABLED: "false"
        run: pytest -q
