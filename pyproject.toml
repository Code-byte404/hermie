[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermie"
version = "0.3.0"
description = "A local privacy proxy for coding agents: redacts what Claude Code, Codex, Gemini CLI and aider send to the cloud, restores placeholders in the replies, and keeps a verbatim receipt."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["privacy", "proxy", "coding-agent", "claude-code", "codex", "gemini", "aider", "pii", "presidio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "starlette==0.50.0",
  "uvicorn==0.38.0",
  "httpx==0.28.1",
  "presidio-analyzer==2.2.364",
  "spacy==3.8.16",
  "anyio==4.15.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.140.0"]
laya = ["laya-mlx==0.3.0"]   # optional judge backend, Apple Silicon only

[project.urls]
Homepage = "https://github.com/Code-byte404/hermie"
Issues = "https://github.com/Code-byte404/hermie/issues"

[project.scripts]
hermie = "hermie.cli:main"

[tool.setuptools.packages.find]
include = ["hermie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: real clients through a real proxy to the real upstreams (skipped by default; run with -m live)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
